name: CI

# Runs CLAUDE.md rule 7 (typecheck + tests + build) on every PR and on main,
# so a PR can't be merged on "it passed on my machine".
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTENT_SOURCE: fixture
      NEXT_PUBLIC_INDEXABLE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build (root)
        run: pnpm build

      - name: Build (subpath, as deployed on nicolino.zip)
        run: pnpm build
        env:
          BASE_PATH: /testsite/caravelas
          NEXT_PUBLIC_SITE_URL: https://nicolino.zip/testsite/caravelas
